name: LanTransfer
options:
  bundleIdPrefix: com.lantransfer
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

packages:
  LanTransferCore:
    path: Packages/LanTransferCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  LanTransferApp:
    type: application
    platform: iOS
    sources:
      - path: LanTransferApp
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    info:
      path: LanTransferApp/Info.plist
    entitlements:
      path: LanTransferApp/LanTransferApp.entitlements
    dependencies:
      - package: LanTransferCore
        product: LanTransferProtocol
      - package: LanTransferCore
        product: LanTransferDomain
      - package: LanTransferCore
        product: LanTransferEngine
      - target: LanTransferShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lantransfer.app
        PRODUCT_NAME: LanTransfer
        PRODUCT_MODULE_NAME: LanTransferApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - LanTransferAppTests

  LanTransferShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LanTransferShareExtension
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: LanTransferApp/UI/Text/UiText.g.swift
      - path: LanTransferApp/UI/Theme/LanTheme.swift
      - path: LanTransferApp/Platform/AppGroupConfig.swift
      - path: LanTransferApp/Platform/Storage/SqliteDatabase.swift
      - path: LanTransferApp/Resources/zh-Hans.lproj
    info:
      path: LanTransferShareExtension/Info.plist
    entitlements:
      path: LanTransferShareExtension/LanTransferShareExtension.entitlements
    dependencies:
      - package: LanTransferCore
        product: LanTransferProtocol
      - package: LanTransferCore
        product: LanTransferDomain
      - package: LanTransferCore
        product: LanTransferEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lantransfer.app.share
        PRODUCT_NAME: LanTransferShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  LanTransferAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LanTransferAppTests
    dependencies:
      - target: LanTransferApp
      - package: LanTransferCore
        product: LanTransferTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lantransfer.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LanTransfer.app/LanTransfer"
        BUNDLE_LOADER: "$(TEST_HOST)"
