# Windows 端：以锁定模式还原（CI=true）、Release 构建（警告即错误）并运行全部 xUnit v3 / FsCheck 测试。
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      pbt-scale:
        description: 属性测试迭代次数倍数（LT_PBT_SCALE）
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  build:
    name: dotnet build and test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LT_PBT_SCALE: ${{ inputs.pbt-scale || '1' }}
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: 还原（锁定模式）
        run: dotnet restore LanTransfer.sln
      - name: 构建
        run: dotnet build LanTransfer.sln -c Release --no-restore
      - name: 测试
        run: dotnet test --solution LanTransfer.sln -c Release --no-build
      - name: 上传测试结果
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-results
          path: windows/**/TestResults/
          retention-days: 14
