# Android 端 JVM 构建：core 模块与 peer-cli 的单元 / 属性测试、animal-sniffer 检查，以及 :app 的构建、Lint 与 Robolectric 测试。
name: android-jvm

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      pbt-scale:
        description: 属性测试迭代次数倍数（LT_PBT_SCALE）
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LT_PBT_SCALE: ${{ inputs.pbt-scale || '1' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      # 同时校验 gradle-wrapper.jar 的校验和
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: 构建、静态检查与 JVM 测试
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-jvm-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 14
