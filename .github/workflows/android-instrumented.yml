# Android 仪器测试：在模拟器矩阵（API 26 / 29 / 33 / 34 / 36）上运行 :app 的 androidTest（存储、FileProvider、Compose UI 等）。
name: android-instrumented

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 29
            target: default
          - api-level: 33
            target: google_apis
          - api-level: 34
            target: google_apis
          - api-level: 36
            target: google_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: 预先构建测试 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: 在模拟器上运行仪器测试
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumented-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/
          retention-days: 14
